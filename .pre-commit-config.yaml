---
# Common commands:
# pre-commit install
# pre-commit autoupdate
# pre-commit run --all-files copier-template-tester

default_install_hook_types: ["commit-msg", "pre-commit", "pre-push"]

repos:
  - repo: https://github.com/kyleking/copier-template-tester
    rev: 2.4.0
    hooks:
      - id: copier-template-tester

  # mise runs a task under `sh`, which is dash on Ubuntu, so a task that needs
  # bash has to say so. The renders are what children receive.
  - repo: local
    hooks:
      - id: mise-task-shells
        name: mise tasks that need bash declare it
        entry: python3 scripts/check_task_shells.py
        language: system
        files: ^\.ctt/[^/]+/\.config/mise/conf\.d/.*\.toml$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: \.copier-answers\.yml
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: trailing-whitespace

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen

  # No TOML formatter here on purpose. Children format TOML with hk's
  # `tombi-format`, and a toml-sort run in this repo reshaped the committed
  # .ctt/ renders into a form every child then rewrote on its first commit.
  - repo: https://github.com/KyleKing/calcipy
    rev: 6.0.1
    hooks:
      - id: copier-forbidden-files
