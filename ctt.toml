# Configuration for: https://github.com/KyleKing/copier-template-tester

[ctt]
source_directory = "go_template"

[defaults]
author_email = "ctt@ctt.ctt"
author_name = "Carl The Template"
author_username = "user_ctt"
development_branch = "main"
project_description = "Generated by copier-template-tester"
project_name = "test-template"
project_type = "cli"
repository_provider = "https://github.com"

[output.".ctt/default"]
module_path = "github.com/user_ctt/test-template"
project_type = "cli"
use_goreleaser = true

[output.".ctt/library"]
module_path = "github.com/user_ctt/test-template"
project_type = "library"
use_goreleaser = false

[output.".ctt/no_goreleaser"]
module_path = "github.com/user_ctt/test-template"
project_type = "cli"
use_goreleaser = false

[output.".ctt/python"]
module_path = "github.com/user_ctt/test-template"
project_type = "cli"
publish_python = true
use_goreleaser = true

[output.".ctt/python_no_goreleaser"]
module_path = "github.com/user_ctt/test-template"
project_type = "cli"
publish_python = true
use_goreleaser = false
