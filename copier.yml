---
_min_copier_version: 9.0.0

# ====== TEMPLATE ======
_answers_file: .copier-answers.yml
_subdirectory: go_template
# go_template/.claude/skills links to .agents/skills, the layout coding agents
# share; render it as a link rather than a second copy.
_preserve_symlinks: true
_skip_if_exists:
  - .doneram.pkl
  - DESIGN.md
  - README.md
  - .config/mise.toml
  - cmd/{{ project_name }}/main.go
  - demo/stills.tape
  - go.mod

_tasks:
  - git init
  # The operation decides whether the version is restored here or after the
  # update's diff (see _migrations).
  - python _copier_post_generation.py "{{ _copier_operation }}"

# Runs after every update's diff is applied, in the project.
#
# The diff carries the real .cz.toml version over the rendered 0.0.0, unless a
# conflict elsewhere in the file rejects its hunk; then the version is read back
# from HEAD, since an unnoticed 0.0.0 cuts v0.0.1 on the next release.
#
# A project past 0.x drops major_version_zero, because commitizen does not refuse
# the key there: it bumps a breaking change as a minor. Every update rather than
# once, since a rejected hunk can leave the template's line in place.
_migrations:
  - command:
      - python3
      - -c
      - |
        import pathlib, re, subprocess
        cz = pathlib.Path(".cz.toml")
        text = cz.read_text() if cz.is_file() else ""
        placeholder = re.compile(r'^version = "0\.0\.0"$', re.MULTILINE)
        if placeholder.search(text):
            try:
                head = subprocess.run(["git", "show", "HEAD:.cz.toml"], capture_output=True, text=True).stdout
            except OSError:
                head = ""
            real = re.search(r'^version = "(.+)"$', head, re.MULTILINE)
            if real and real.group(1) != "0.0.0":
                text = placeholder.sub('version = "' + real.group(1) + '"', text, count=1)
                print("Restored .cz.toml version to " + real.group(1))
        major = re.search(r'^version = "(\d+)\.', text, re.MULTILINE)
        if major and int(major.group(1)) >= 1:
            block = r"^# While the version is 0\.x[^\n]*\n(?:#[^\n]*\n)*major_version_zero = true\n?"
            text = re.sub(block, "", text, flags=re.MULTILINE)
        if text:
            cz.write_text(text)

_message_after_copy: |
  The '{{ project_name }}' Go project has been initialized!

  1. Review the generated files
  2. Install mise tools and resolve the lint ruleset's import: `mise install && go mod tidy`
  3. Install git hooks: `hk install --mise`
  4. Run `mise run ci` to verify setup
  5. If this is a new project, commit and create the GitHub repo:

      ```sh
      git add --all
      git commit --message 'feat: Initialize with my_go_template'
      gh repo create "{{ project_name }}" --public --source=. --remote=origin --push
      ```

# ====== QUESTIONS ======
development_branch:
  type: str
  help: The GitHub branch name used for development
  default: main

project_name:
  type: str
  help: Your project name (lowercase, hyphens allowed)

project_description:
  type: str
  help: Your project description

author_name:
  type: str
  help: Your full name
  default: Kyle King

author_email:
  type: str
  help: Your account email
  default: dev.act.kyle@gmail.com

repository_provider:
  type: str
  help: Your repository provider
  default: https://github.com

author_username:
  type: str
  help: Your username for {{ repository_provider }}
  default: kyleking

repository_namespace:
  type: str
  help: Your repository namespace
  default: "{{ author_username }}"

module_path:
  type: str
  help: Go module path (e.g., github.com/user/project)
  default: "github.com/{{ repository_namespace }}/{{ project_name }}"

copyright_date:
  type: str
  help: The copyright year
  default: "{{ '%Y' | strftime }}"

project_type:
  type: str
  help: Project type determines structure and tooling (cli=CLI/TUI application with goreleaser, library=Reusable Go library)
  choices:
    - cli
    - library
  default: cli

use_goreleaser:
  type: bool
  help: Include goreleaser configuration for releases
  default: true

publish_python:
  type: bool
  help: Also ship this Go code as a Python package on PyPI (cgo c-shared library bound with ctypes)
  default: false

# ====== INTERNAL ======
# Only the two language versions are answers, because they set the level a
# generated project compiles and runs against and are a real per-project choice.
# Every other tool version is a literal in the file that consumes it, listed in
# .doneram.pkl, and updated to latest by doneram rather than by hand.
go_version:
  type: str
  help: Go toolchain version pinned in mise
  default: "1.26.11"
  when: false

python_version:
  type: str
  help: Python version pinned in mise
  default: "3.14.7"
  when: false

python_package_name:
  type: str
  help: Importable Python package name derived from project_name
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"
  when: false

cgo_export_prefix:
  type: str
  help: Prefix on every symbol the c-shared library exports
  default: "{{ python_package_name | replace('_', ' ') | title | replace(' ', '') }}"
  when: false
