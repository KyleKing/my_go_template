---
_min_copier_version: 9.0.0

# ====== TEMPLATE ======
_answers_file: .copier-answers.yml
_subdirectory: go_template
_skip_if_exists:
  - DESIGN.md
  - README.md
  - .config/mise.toml
  - cmd/{{ project_name }}/main.go
  - go.mod

_tasks:
  - git init
  - python _copier_post_generation.py

_message_after_copy: |
  The '{{ project_name }}' Go project has been initialized!

  1. Review the changes and commit
  2. Install mise tools: `mise install`
  3. Install git hooks: `hk install --mise`
  4. Run `mise run ci` to verify setup
  5. If this is a new project, create the GitHub repo:

      ```sh
      gh repo create "{{ project_name }}" --source=. --remote=origin --push
      ```

# ====== QUESTIONS ======
development_branch:
  type: str
  help: The GitHub branch name used for development
  default: main

project_name:
  type: str
  help: Your project name (lowercase, hyphens allowed)

project_description:
  type: str
  help: Your project description

author_name:
  type: str
  help: Your full name
  default: Kyle King

author_email:
  type: str
  help: Your account email
  default: dev.act.kyle@gmail.com

repository_provider:
  type: str
  help: Your repository provider
  default: https://github.com

author_username:
  type: str
  help: Your username for {{ repository_provider }}
  default: kyleking

repository_namespace:
  type: str
  help: Your repository namespace
  default: "{{ author_username }}"

module_path:
  type: str
  help: Go module path (e.g., github.com/user/project)
  default: "github.com/{{ repository_namespace }}/{{ project_name }}"

copyright_date:
  type: str
  help: The copyright year
  default: "{{ '%Y' | strftime }}"

project_type:
  type: str
  help: Project type determines structure and tooling (cli=CLI/TUI application with goreleaser, library=Reusable Go library)
  choices:
    - cli
    - library
  default: cli

use_goreleaser:
  type: bool
  help: Include goreleaser configuration for releases
  default: true

publish_python:
  type: bool
  help: Also ship this Go code as a Python package on PyPI (cgo c-shared library bound with ctypes)
  default: false

# ====== INTERNAL ======
# Every tool version is defined once here and substituted wherever it is needed,
# so a pin can never disagree between mise and a workflow. Unpinned tools drift
# between a laptop and a CI runner, and a formatter that drifts fails only in CI.
# PLANNED: hand these pins to doner (../doner) once it reads mise TOML as well as
# Dockerfiles, so they update on its schedule instead of by hand.
actionlint_version:
  type: str
  help: actionlint version pinned in mise
  default: "1.7.12"
  when: false

commitizen_version:
  type: str
  help: commitizen version pinned in mise
  default: "4.17.0"
  when: false

go_version:
  type: str
  help: Go toolchain version pinned in mise
  default: "1.26.6"
  when: false

golangci_lint_version:
  type: str
  help: golangci-lint version pinned in mise and the CI lint job
  default: "2.12.2"
  when: false

golines_version:
  type: str
  help: golines version pinned in mise
  default: "0.15.0"
  when: false

hk_version:
  type: str
  help: hk git-hooks framework version pinned in hk.pkl and mise
  default: "1.53.0"
  when: false

jq_version:
  type: str
  help: jq version pinned in mise
  default: "1.8.2"
  when: false

ls_lint_version:
  type: str
  help: ls-lint version pinned in mise
  default: "2.3.1"
  when: false

pkl_version:
  type: str
  help: pkl version pinned in mise
  default: "0.32.1"
  when: false

python_version:
  type: str
  help: Python version pinned in mise
  default: "3.14.7"
  when: false

shellcheck_version:
  type: str
  help: shellcheck version pinned in mise
  default: "0.11.0"
  when: false

tombi_version:
  type: str
  help: tombi version pinned in mise
  default: "1.4.0"
  when: false

typos_version:
  type: str
  help: typos version pinned in mise
  default: "1.49.0"
  when: false

uv_version:
  type: str
  help: uv version pinned in mise
  default: "0.12.5"
  when: false

yamllint_version:
  type: str
  help: yamllint version pinned in mise
  default: "1.38.0"
  when: false

python_package_name:
  type: str
  help: Importable Python package name derived from project_name
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"
  when: false

cgo_export_prefix:
  type: str
  help: Prefix on every symbol the c-shared library exports
  default: "{{ python_package_name | replace('_', ' ') | title | replace(' ', '') }}"
  when: false
