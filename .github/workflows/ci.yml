---
name: CI

"on":
  pull_request: null
  push:
    branches: [main]

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            project_type: cli
            use_goreleaser: true
            publish_python: false
          - name: library
            project_type: library
            use_goreleaser: false
            publish_python: false
          - name: no_goreleaser
            project_type: cli
            use_goreleaser: false
            publish_python: false
          - name: python
            project_type: cli
            use_goreleaser: true
            publish_python: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Generate project (${{ matrix.name }})
        run: |
          uvx copier copy --trust --defaults \
            --data development_branch=main \
            --data project_name=test-template \
            --data "project_description=Generated in CI" \
            --data "author_name=Carl The Template" \
            --data author_email=ctt@ctt.ctt \
            --data author_username=user_ctt \
            --data module_path=github.com/user_ctt/test-template \
            --data project_type=${{ matrix.project_type }} \
            --data use_goreleaser=${{ matrix.use_goreleaser }} \
            --data publish_python=${{ matrix.publish_python }} \
            . "$RUNNER_TEMP/generated"

      - name: Template tasks that need bash declare it
        run: python3 scripts/check_task_shells.py "$RUNNER_TEMP"/generated/.config/mise/conf.d/*.toml

      - name: Vet and build generated project
        working-directory: ${{ runner.temp }}/generated
        run: |
          go vet ./...
          go build ./...
