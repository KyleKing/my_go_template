---
name: CI

"on":
  pull_request: null
  push:
    branches: [main]

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            project_type: cli
            use_goreleaser: true
            publish_python: false
          - name: library
            project_type: library
            use_goreleaser: false
            publish_python: false
          - name: no_goreleaser
            project_type: cli
            use_goreleaser: false
            publish_python: false
          - name: python
            project_type: cli
            use_goreleaser: true
            publish_python: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Generate project (${{ matrix.name }})
        run: |
          uvx copier copy --trust --defaults \
            --data development_branch=main \
            --data project_name=test-template \
            --data "project_description=Generated in CI" \
            --data "author_name=Carl The Template" \
            --data author_email=ctt@ctt.ctt \
            --data author_username=user_ctt \
            --data module_path=github.com/user_ctt/test-template \
            --data project_type=${{ matrix.project_type }} \
            --data use_goreleaser=${{ matrix.use_goreleaser }} \
            --data publish_python=${{ matrix.publish_python }} \
            . "$RUNNER_TEMP/generated"

      - name: Vet and build generated project
        working-directory: ${{ runner.temp }}/generated
        run: |
          if [ -z "$(find . -name '*.go' -not -path './.git/*')" ]; then
            printf 'package testtemplate\n' > lib.go
          fi
          go vet ./...
          go build ./...
