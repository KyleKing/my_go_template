---
name: Freshness

"on":
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The template's own pins live in go_template/ and reach every generated
  # project through one release, so this is where they are bumped. The plan
  # job applies every update to a throwaway checkout and splits the changes
  # into groups: one PR for security fixes and routine updates, one per
  # major that needs review, and one per bump that breaks validation.
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.plan.outputs.groups || '[]' }}
      plan: ${{ steps.encode.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # sync_with_ctt.sh, the afterPatch hook, renders with uvx.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # pkl evaluates .doneram.pkl and mise answers the tool resolvers.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - uses: kyleking/doneram@065160ffcca308f24122254915a885656293882f # v3.1.0
        with:
          version: v3.1.0

      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: doneram update --output /tmp/plan.json

      - id: encode
        run: echo "plan=$(base64 -w0 /tmp/plan.json)" >> "$GITHUB_OUTPUT"

  pr:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      HAS_APP: ${{ secrets.DONERAM_APP_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # sync_with_ctt.sh, the afterPatch hook, renders with uvx.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # pkl evaluates .doneram.pkl and mise answers the tool resolvers.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - uses: kyleking/doneram@065160ffcca308f24122254915a885656293882f # v3.1.0
        with:
          version: v3.1.0

      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ needs.plan.outputs.plan }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          echo "$PLAN" | base64 -d > /tmp/plan.json
          doneram update --plan /tmp/plan.json --group "$GROUP" --output /tmp/doneram.json

      # GITHUB_TOKEN cannot push a branch that edits .github/workflows/**.
      # When the doneram app is installed with secrets set, its scoped
      # installation token covers that push; otherwise the job token opens
      # the PR and any workflow-file patch fails the push loudly.
      - id: app-token
        if: env.HAS_APP == 'true' && steps.check.outputs.has_upgrades == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.DONERAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.DONERAM_APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: steps.check.outputs.has_upgrades == 'true'
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: doneram/${{ matrix.group }}
          draft: true
          delete-branch: true
          title: ${{ steps.check.outputs.title }}
          body: ${{ steps.check.outputs.body }}
